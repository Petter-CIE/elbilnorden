# Automatické nasazení na one.com přes SFTP.
# Spouští se po každém merge/pushi do main: sestaví web (Eleventy → _site/) a nahraje jen změněné soubory.
# Co je změněné, se pozná podle otisků souborů v .deploy-manifest na serveru (uloží se po každém nasazení).
# Ručně (Actions → "Nasazení na one.com" → Run workflow) lze nahrát celý web.
# Na serveru se NIC nemaže – smazání souboru z repozitáře se na one.com neprojeví.
#
# Potřebné údaje (Settings → Secrets and variables → Actions):
#   Secrets:   ONECOM_SFTP_HOST, ONECOM_SFTP_USER, ONECOM_SFTP_PASSWORD
#   Variables: ONECOM_SFTP_PORT (výchozí 22), ONECOM_WEBROOT (nepovinné – jinak se složka webu najde sama)

name: Nasazení na one.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Nahrát celý web (nejen změněné soubory)"
        type: boolean
        default: false

concurrency:
  group: deploy-onecom
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.ONECOM_SFTP_HOST }}
      SFTP_USER: ${{ secrets.ONECOM_SFTP_USER }}
      LFTP_PASSWORD: ${{ secrets.ONECOM_SFTP_PASSWORD }}
      PORT: ${{ vars.ONECOM_SFTP_PORT || '22' }}
      WEBROOT: ${{ vars.ONECOM_WEBROOT }}
    steps:
      - uses: actions/checkout@v5

      - name: Kontrola nastavení
        run: |
          for v in HOST SFTP_USER LFTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Chybí secret pro $v – viz komentář v deploy.yml"; exit 1; fi
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Sestavení webu (Eleventy)
        run: |
          npm ci --no-audit --no-fund
          npx eleventy
          (cd _site && find . -type f ! -name '.deploy-manifest' -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #') > manifest.local
          echo "Sestaveno souborů: $(wc -l < manifest.local)"

      - name: Instalace lftp a ověření klíče serveru
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "::error::Server $HOST:$PORT neodpovídá"; exit 1; }

      - name: Přihlášení a nalezení kořene webu
        id: root
        run: |
          set -u
          LOGIN="set sftp:auto-confirm no; set net:max-retries 2; set net:timeout 20; open -u \"$SFTP_USER\" --env-password -p $PORT sftp://$HOST"

          # Kořen webu = složka se send.php, jejíž index.html patří k elbilnorden.no
          # (na stejném účtu mohou být i jiné weby).
          is_site() { lftp -c "$LOGIN; cat \"$1/index.html\"" 2>/dev/null | grep -q 'https://elbilnorden.no/'; }

          if [ -n "$WEBROOT" ]; then
            if is_site "$WEBROOT"; then echo "dir=$WEBROOT" >> "$GITHUB_OUTPUT"; echo "Kořen webu: $WEBROOT"; exit 0; fi
            echo "::error::Složka z ONECOM_WEBROOT ($WEBROOT) neobsahuje index.html elbilnorden.no"; exit 1
          fi

          # Projít strom do hloubky 3. Na one.com jsou "webroots" a "/www" symbolické
          # odkazy, proto se prochází přes cls (find do odkazů nevstupuje).
          if ! lftp -c "$LOGIN; cls -1 ." > /dev/null 2> err.txt; then
            echo "::error::Přihlášení přes SFTP selhalo: $(head -c 300 err.txt | tr '\n' ' ')"; exit 1
          fi
          echo "== Hledání složky webu =="
          queue=("." "webroots" "/www" "/webroots"); depth=(0 0 0 0); visited=0; found=""
          while [ ${#queue[@]} -gt 0 ] && [ $visited -lt 60 ]; do
            d="${queue[0]}"; l="${depth[0]}"; queue=("${queue[@]:1}"); depth=("${depth[@]:1}")
            visited=$((visited+1))
            list=$(lftp -c "$LOGIN; cls -1F \"$d/\"" 2>/dev/null) || continue
            echo "  $d: $(echo "$list" | sed -E 's#^.*/([^/]+/?@?)$#\1#' | grep -vE '^\.\.?/$' | head -15 | tr '\n' ' ')"
            if echo "$list" | grep -qE '(^|/)send\.php$' && echo "$list" | grep -qE '(^|/)index\.html$' && is_site "$d"; then
              found="$d"; break
            fi
            [ "$l" -ge 3 ] && continue
            while IFS= read -r e; do
              n="${e%@}"; n="${n%/}"; n="${n##*/}"
              case "$n" in ''|.|..|.*) continue ;; esac
              case "$e" in */|*@) queue+=("$d/$n"); depth+=($((l+1))) ;; esac
            done <<< "$list"
          done

          if [ -z "$found" ]; then
            echo "::error::Nenašel jsem složku se send.php a index.html elbilnorden.no – nastavte ONECOM_WEBROOT podle výpisu výše."; exit 1
          fi
          echo "dir=$found" >> "$GITHUB_OUTPUT"; echo "Kořen webu: $found"

      - name: Nahrání na one.com
        env:
          ROOT: ${{ steps.root.outputs.dir }}
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          LOGIN="set sftp:auto-confirm no; set net:max-retries 3; open -u \"$SFTP_USER\" --env-password -p $PORT sftp://$HOST"
          if [ "${FULL:-false}" = "true" ]; then : > manifest.remote
          else lftp -c "$LOGIN; cat \"$ROOT/.deploy-manifest\"" > manifest.remote 2>/dev/null || : > manifest.remote; fi
          # soubory, jejichž otisk se liší od posledního nasazení (nebo jsou nové)
          comm -23 <(sort manifest.local) <(sort manifest.remote) | sed -E 's/^[0-9a-f]+  //' > upload.txt
          COUNT=$(wc -l < upload.txt | tr -d ' ')
          echo "Soubory k nahrání ($COUNT):"; cat upload.txt
          cp manifest.local _site/.deploy-manifest
          {
            echo "set sftp:auto-confirm no"
            echo "set net:max-retries 3"
            echo "set cmd:fail-exit yes"
            echo "open -u \"$SFTP_USER\" --env-password -p $PORT sftp://$HOST"
            echo "cd \"$ROOT\""
            echo "lcd _site"
            while IFS= read -r f; do
              d=$(dirname "$f")
              [ "$d" != "." ] && echo "mkdir -p -f \"$d\""
              echo "put \"$f\" -o \"$f\""
            done < upload.txt
            echo "put .deploy-manifest -o .deploy-manifest"
          } > deploy.lftp
          lftp -f deploy.lftp
          echo "Nahráno souborů: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' upload.txt >> "$GITHUB_STEP_SUMMARY"
